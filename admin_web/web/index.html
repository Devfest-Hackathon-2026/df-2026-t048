<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PostCheck 施設・撮影ルールの管理">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="postcheck_admin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PostCheck — 施設ルール管理</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // A link opened into an already-running tab must pass through cold-start
    // token handling too. Never forward or print the fragment.
    window.addEventListener('hashchange', (event) => {
      if (/^#access=[a-f0-9]{64}$/.test(window.location.hash)) {
        event.stopImmediatePropagation();
        window.location.reload();
      }
    });
  </script>
  <script src="maps.local.js"></script>
  <script>
    (window.postcheckMapsReady || Promise.resolve()).then(() => {
      const script = document.createElement('script');
      script.src = 'flutter_bootstrap.js';
      document.body.appendChild(script);
    }).catch(() => {
      document.body.textContent = '地図を読み込めませんでした。接続とMapsキーの設定を確認し、再読み込みしてください。';
    });
  </script>
</body>
</html>
